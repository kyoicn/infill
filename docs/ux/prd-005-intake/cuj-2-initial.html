<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CUJ-2 LLM 识别中（initial）</title>
<link rel="stylesheet" href="_shared.css">
<style>
  /* CUJ-2 specific */
  .recognize-card { display: flex; flex-direction: column; align-items: center; padding: 64px 40px; }
  .recognize-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .recognize-sub { font-size: 13px; color: var(--text-3); margin-bottom: 40px; }
  .steps { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 40px; }
  .step { display: flex; flex-direction: column; align-items: center; min-width: 120px; }
  .step-dot {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; border: 2px solid var(--border); background: #fff; color: var(--text-3);
    transition: all 0.2s;
  }
  .step.done .step-dot { border-color: var(--green); background: var(--green); color: #fff; }
  .step.active .step-dot { border-color: var(--primary); background: var(--primary); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
  .step.todo .step-dot { border-color: var(--border); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(22,119,255,0.5); } 50% { box-shadow: 0 0 0 8px rgba(22,119,255,0); } }
  .step-label { margin-top: 8px; font-size: 13px; color: var(--text-2); text-align: center; }
  .step.active .step-label { color: var(--primary); font-weight: 500; }
  .step.done .step-label { color: var(--text-3); }
  .step-line { flex: 0 0 60px; height: 2px; background: var(--border-light); margin-top: 15px; }
  .step-line.done { background: var(--green); }
  .progress-bar { width: 360px; height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-hover)); width: 60%; border-radius: 3px; transition: width 0.4s; }
  .progress-text { font-size: 13px; color: var(--text-2); margin-bottom: 32px; }
  .recognize-tip { font-size: 12px; color: var(--text-3); margin-top: 12px; max-width: 480px; text-align: center; line-height: 1.6; }
  .meta-list { display: flex; gap: 20px; font-size: 12px; color: var(--text-3); margin-bottom: 24px; }
  .meta-list .item b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>

<div class="layout">

  <aside class="sider">
    <div class="sider-logo">打印排班</div>
    <ul class="menu">
      <li>仪表盘</li>
      <li>产品目录</li>
      <li class="active">
        <svg viewBox="64 64 896 896"><path d="M136 384h56c4.4 0 8-3.6 8-8V200h176c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8H149.6c-12 0-21.6 9.6-21.6 21.6V376c0 4.4 3.6 8 8 8zm56 256h-56c-4.4 0-8 3.6-8 8v234.4c0 12 9.6 21.6 21.6 21.6H376c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8H200V648c0-4.4-3.6-8-8-8zM896 128H637.6c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8H824v176c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8V149.6c0-12-9.6-21.6-21.6-21.6zM888 640h-56c-4.4 0-8 3.6-8 8v176H648c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h238.4c12 0 21.6-9.6 21.6-21.6V648c0-4.4-3.6-8-8-8zm-94-294H230c-4.4 0-8 3.6-8 8v60c0 4.4 3.6 8 8 8h564c4.4 0 8-3.6 8-8v-60c0-4.4-3.6-8-8-8z"/></svg>产品录入
      </li>
      <li>订单管理</li>
      <li>库存管理</li>
      <li>排班中心</li>
      <li>系统设置</li>
    </ul>
  </aside>

  <main class="content">
    <h1 class="page-title">产品录入 · 识别中</h1>

    <div class="card recognize-card">
      <div class="recognize-title">正在识别 11 张图片…</div>
      <div class="recognize-sub">完成后会自动跳转到草稿预览页</div>

      <div class="meta-list">
        <span class="item">产品基名：<b>床头柜</b></span>
        <span class="item">组装图：<b>3 张</b></span>
        <span class="item">打印盘：<b>8 张</b></span>
      </div>

      <div class="steps">
        <div class="step done">
          <div class="step-dot">✓</div>
          <div class="step-label">上传图片</div>
        </div>
        <div class="step-line done"></div>
        <div class="step active">
          <div class="step-dot">2</div>
          <div class="step-label">调用 LLM 识别</div>
        </div>
        <div class="step-line"></div>
        <div class="step todo">
          <div class="step-dot">3</div>
          <div class="step-label">解析返回数据</div>
        </div>
      </div>

      <div class="progress-bar"><div class="progress-fill"></div></div>
      <div class="progress-text">约 30 秒，请稍候…</div>

      <div class="footer" style="justify-content: center; gap: 12px; padding-top: 16px;">
        <button class="btn-secondary">取消</button>
      </div>

      <div class="recognize-tip">
        识别期间请勿关闭页面。如果耗时超过 2 分钟仍未完成，可能是网络问题或 LLM 服务异常，可点击取消后重试。
      </div>
    </div>

  </main>
</div>

</body>
</html>
