<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CUJ-4 颜色矩阵（initial — 1 变体未填）</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>

<div class="layout">

  <aside class="sider">
    <div class="sider-logo">打印排班</div>
    <ul class="menu">
      <li>仪表盘</li>
      <li>产品目录</li>
      <li class="active">
        <svg viewBox="64 64 896 896"><path d="M136 384h56c4.4 0 8-3.6 8-8V200h176c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8H149.6c-12 0-21.6 9.6-21.6 21.6V376c0 4.4 3.6 8 8 8zm56 256h-56c-4.4 0-8 3.6-8 8v234.4c0 12 9.6 21.6 21.6 21.6H376c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8H200V648c0-4.4-3.6-8-8-8zM896 128H637.6c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8H824v176c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8V149.6c0-12-9.6-21.6-21.6-21.6zM888 640h-56c-4.4 0-8 3.6-8 8v176H648c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h238.4c12 0 21.6-9.6 21.6-21.6V648c0-4.4-3.6-8-8-8zm-94-294H230c-4.4 0-8 3.6-8 8v60c0 4.4 3.6 8 8 8h564c4.4 0 8-3.6 8-8v-60c0-4.4-3.6-8-8-8z"/></svg>产品录入
      </li>
      <li>订单管理</li>
      <li>库存管理</li>
      <li>排班中心</li>
      <li>系统设置</li>
    </ul>
  </aside>

  <main class="content">
    <h1 class="page-title">产品录入 · 填写颜色</h1>

    <div class="card">
      <div class="section-title">
        <h2>配色变体</h2>
        <span class="desc">为每个组件选择颜色 — 可一次配置多个变体，每个变体合并后作为独立产品条目写入 catalog</span>
      </div>

      <div class="matrix-wrap">
        <table class="matrix-tbl">
          <thead>
            <tr>
              <th class="col-comp">组件</th>
              <th class="col-qty">件数</th>
              <th class="col-variant">
                <div class="variant-head">
                  <input class="input-inline text-w" value="床头柜 - 配色 1" />
                  <div class="variant-head-actions">
                    <button title="复制此列">⎘</button>
                  </div>
                </div>
              </th>
              <th class="col-add" rowspan="7" style="vertical-align: middle; padding: 8px;">
                <button class="add-variant-btn"><span class="plus">+</span><span>新增配色</span></button>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="col-comp">床头柜-侧板</td>
              <td class="col-qty">x2</td>
              <td class="col-variant"><div class="color-cell empty"><span class="color-swatch empty"></span><span class="color-name">选择颜色</span><span class="arrow">▾</span></div></td>
            </tr>
            <tr>
              <td class="col-comp">床头柜-抽屉</td>
              <td class="col-qty">x4</td>
              <td class="col-variant"><div class="color-cell empty"><span class="color-swatch empty"></span><span class="color-name">选择颜色</span><span class="arrow">▾</span></div></td>
            </tr>
            <tr>
              <td class="col-comp">床头柜-隔板大</td>
              <td class="col-qty">x1</td>
              <td class="col-variant"><div class="color-cell empty"><span class="color-swatch empty"></span><span class="color-name">选择颜色</span><span class="arrow">▾</span></div></td>
            </tr>
            <tr>
              <td class="col-comp">床头柜-隔板小</td>
              <td class="col-qty">x2</td>
              <td class="col-variant"><div class="color-cell empty"><span class="color-swatch empty"></span><span class="color-name">选择颜色</span><span class="arrow">▾</span></div></td>
            </tr>
            <tr>
              <td class="col-comp">床头柜-把手</td>
              <td class="col-qty">x4</td>
              <td class="col-variant"><div class="color-cell empty"><span class="color-swatch empty"></span><span class="color-name">选择颜色</span><span class="arrow">▾</span></div></td>
            </tr>
            <tr>
              <td class="col-comp">床头柜-装饰球</td>
              <td class="col-qty">x12</td>
              <td class="col-variant"><div class="color-cell empty"><span class="color-swatch empty"></span><span class="color-name">选择颜色</span><span class="arrow">▾</span></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="footer-prev-next">
      <button class="btn-secondary">← 上一步：校对</button>
      <button class="btn-primary" disabled>
        下一步：合并
        <svg viewBox="64 64 896 896"><path d="M869 487.8L491.2 159.9c-2.9-2.5-6.6-3.9-10.5-3.9h-88.5c-7.4 0-10.8 9.2-5.2 14l350.2 304H152c-4.4 0-8 3.6-8 8v60c0 4.4 3.6 8 8 8h585.1L386.9 854c-5.6 4.9-2.2 14 5.2 14h91.5c1.9 0 3.8-.7 5.2-2L869 536.2a32.07 32.07 0 0 0 0-48.4z"/></svg>
      </button>
    </div>

  </main>
</div>

</body>
</html>
